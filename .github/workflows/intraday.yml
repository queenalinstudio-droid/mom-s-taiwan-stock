name: 盤中更新報價
on:
  schedule:
    - cron: "*/10 1-5 * * 1-5"   # 台灣時間 09:00–13:50 每 10 分鐘（GitHub 有時會延遲幾分鐘）
  workflow_dispatch:
jobs:
  quotes:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/intraday.py
      - name: 存回 GitHub
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data/quotes.json && git commit -m "quotes $(date -u +%H:%M)" || echo "沒有變動"
          git push
