name: 回補過去三個月資料（只跑一次）
on:
  workflow_dispatch:
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/backfill.py
      - run: python scripts/daily.py
      - run: python scripts/intraday.py
      - name: 存回 GitHub
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data && git commit -m "backfill" || echo "沒有變動"
          git push
